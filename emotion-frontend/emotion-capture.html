<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Capture continue — Points</title>
    <script src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body {
        font-family: Segoe UI, sans-serif;
        background: #f7f8fa;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        margin: 0;
      }
      h2 {
        margin: 6px 0 12px;
      }
      #camera-container {
        position: relative;
        width: 340px;
        height: 260px;
        border-radius: 12px;
        overflow: hidden;
        background: #000;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      }
      video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
      }
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform: scaleX(-1);
        z-index: 2;
        pointer-events: none;
      }
      #status {
        margin-top: 12px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h2>Capture continue</h2>

    <div id="camera-container">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>

    <div id="status">Initialisation…</div>

    <script>
      const BACKEND_URL =
        "https://emotion-backend-540292246353.europe-west1.run.app/api/emotions";
      const video = document.getElementById("video");
      const canvas = document.getElementById("overlay");
      const ctx = canvas.getContext("2d");
      const statusEl = document.getElementById("status");
      let displaySize = { width: 0, height: 0 };
      let intervalId = null;

      async function init() {
        statusEl.textContent = "Chargement modèles…";
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri("/models"),
          faceapi.nets.faceLandmark68Net.loadFromUri("/models"),
          faceapi.nets.faceExpressionNet.loadFromUri("/models"),
        ]);
        statusEl.textContent = "Activation caméra…";
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
        });
        video.srcObject = stream;
        await new Promise(
          (r) =>
            (video.onloadedmetadata = () => {
              video.play();
              r();
            })
        );

        // set canvas size to video pixel dims
        displaySize.width = video.videoWidth || video.clientWidth;
        displaySize.height = video.videoHeight || video.clientHeight;
        canvas.width = displaySize.width;
        canvas.height = displaySize.height;
        faceapi.matchDimensions(canvas, displaySize);

        statusEl.textContent = "🎥 Caméra active — capture continue";
        startLoop();
        window.addEventListener("resize", () => {
          displaySize.width = video.videoWidth || video.clientWidth;
          displaySize.height = video.videoHeight || video.clientHeight;
          canvas.width = displaySize.width;
          canvas.height = displaySize.height;
          faceapi.matchDimensions(canvas, displaySize);
        });
      }

      function drawPoints(points) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "rgba(255,120,60,0.9)";
        for (const p of points) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.4, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function startLoop() {
        if (intervalId) clearInterval(intervalId);
        intervalId = setInterval(async () => {
          const res = await faceapi
            .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
            .withFaceLandmarks()
            .withFaceExpressions();
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if (!res) {
            statusEl.textContent = "🚫 Visage non détecté";
            return;
          }
          const resized = faceapi.resizeResults(res, displaySize);
          drawPoints(resized.landmarks.positions);

          // show dominant emotion in status and send to backend
          const sorted = Object.entries(res.expressions).sort(
            (a, b) => b[1] - a[1]
          );
          const [mood, confidence] = sorted[0];
          statusEl.textContent = `${mood} ${(confidence * 100).toFixed(1)}%`;

          // send to backend (non-blocking)
          const payload = {
            user_id: "u001",
            session_id: "sess-001",
            mood,
            confidence,
            timestamp: new Date().toISOString(),
          };
          fetch(BACKEND_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          }).catch((e) => console.error("send err", e));
        }, 1000); // 1s interval to avoid spamming backend
      }

      window.addEventListener("load", init);
    </script>
  </body>
</html>
